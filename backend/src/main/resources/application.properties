spring.application.name=stockpro-back

# ===============================
# Base de donnees PostgreSQL
# Les identifiants ne sont plus codes en dur (l'ancien mot de passe "admin123"
# etait expose dans le depot) : ils viennent desormais de variables d'environnement.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_stock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# ===============================
# JPA / Hibernate
# Le schema est desormais gere par Flyway (voir src/main/resources/db/migration) :
# Hibernate ne doit jamais modifier le schema (ddl-auto=none).
# NOTE : ddl-auto=validate a ete teste mais rejete : le schema utilise des DOMAINES
# PostgreSQL personnalises (ex. le domaine "ID" pour tous les identifiants), qu'Hibernate
# ne resout pas correctement lors de la validation (il voit le type du domaine au lieu
# du type sous-jacent VARCHAR, et remonte un faux positif de type de colonne).
# Flyway est la seule source de verite pour le schema : Hibernate n'a pas besoin
# de le revalider en plus.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Flyway (migrations de schema versionnees, remplace les scripts SQL manuels)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Si ta base existe déjà (créée à la main avec crebas.sql + les 3 scripts fournis
# AVANT l'introduction de Flyway), baseline-version=4 dit à Flyway "considère que
# V1 à V4 sont déjà appliqués, ne les rejoue pas". Sur une base neuve/vide,
# Flyway ignore baseline-version et rejoue tout normalement depuis V1.
spring.flyway.baseline-version=4

# ===============================
# Serveur
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# JWT
# Secret desormais fourni via variable d'environnement JWT_SECRET en production.
# La valeur par defaut ci-dessous est UNIQUEMENT destinee au developpement local
# (nouveau secret genere : l'ancien avait ete expose dans le depot Git).
# ===============================
jwt.secret=${JWT_SECRET:uXgJcleM3EDsS4ij8V/pa59hte2RSQaWqlhPheMS2533CKPg8iJMzbJu5MmxZR9O}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS
# Liste blanche d'origines (au lieu de "*" en dur) : une seule origine de dev par defaut,
# a surcharger via la variable d'environnement CORS_ALLOWED_ORIGINS (liste separee par des virgules)
# en fonction des environnements (staging/prod).
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
